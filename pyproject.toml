[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyro-ai-content-engine"
version = "1.3.0"
description = "Review-first AI content planning, script engineering, storyboards, and optional image generation for VYRO MEDIA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "typer>=0.12,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
vyro-ai = "vyro_ai_content_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
